modLoader = "javafml"
loaderVersion = "[47,)"
license = "Apache-2.0"

[[mods]]
modId = "voxy_compat_patch"
version = "${version}"
displayName = "Voxy Compatibility Patch"
authors = "Voxy Compatibility Patch contributors"
description = '''
Compatibility boundaries for Voxy 0.2.13 with Oculus and Sable on Forge 1.20.1.
'''
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.voxy_compat_patch]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.voxy_compat_patch]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.voxy_compat_patch]]
modId = "voxy"
mandatory = true
versionRange = "[0.2.13-alpha,0.2.14)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.voxy_compat_patch]]
modId = "oculus"
mandatory = false
versionRange = "[1.8.0,1.9.0)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.voxy_compat_patch]]
modId = "sable"
mandatory = false
versionRange = "[2.0.5,)"
ordering = "AFTER"
side = "CLIENT"
