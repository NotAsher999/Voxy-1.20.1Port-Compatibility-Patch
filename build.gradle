plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
}

base {
    archivesName = 'voxy-compatibility-patch-1.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = '1.20.1'
        mappingsVersion = '2023.09.03'
    }

    mods {
        voxy_compat_patch {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = uri('https://repo.spongepowered.org/repository/maven-public')
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version)
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'Voxy Compatibility Patch',
                'Specification-Vendor'    : 'Voxy Compatibility Patch contributors',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Voxy Compatibility Patch contributors',
                'MixinConfigs'             : 'voxy-compatibility-patch.mixins.json'
        ])
    }
}
